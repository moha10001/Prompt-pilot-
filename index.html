<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prompt Pilot</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #0f172a;
  color: #fff;
}

.container {
  width: 92%;
  max-width: 900px;
  margin: 30px auto;
}

.header {
  text-align: center;
  margin-bottom: 25px;
}

.logo {
  font-size: 42px;
  font-weight: bold;
}

.subtitle {
  color: #94a3b8;
  margin-top: 8px;
}

.card {
  background: #1e293b;
  padding: 22px;
  border-radius: 18px;
  margin-bottom: 20px;
}

label {
  display: block;
  margin: 15px 0 8px;
  font-weight: bold;
}

textarea,
select {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #334155;
  background: #0f172a;
  color: white;
  font-size: 16px;
}

textarea {
  min-height: 150px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 18px;
  border: 0;
  border-radius: 10px;
  background: #6366f1;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #4f46e5;
}

.result {
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 18px;
  min-height: 180px;
  white-space: pre-wrap;
  line-height: 1.8;
  direction: ltr;
  text-align: left;
}

.copy {
  background: #10b981;
}

.copy:hover {
  background: #059669;
}

.clear {
  background: #475569;
}

.footer {
  text-align: center;
  color: #64748b;
  font-size: 13px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">🚀 Prompt Pilot</div>
    <div class="subtitle">
      حوّل فكرتك إلى Prompt احترافي جاهز للاستخدام
    </div>
  </div>

  <div class="card">

    <label>💡 فكرتك</label>

    <textarea
      id="idea"
      placeholder="اكتب فكرتك هنا..."
    ></textarea>

    <label>🎯 نوع المحتوى</label>

    <select id="type">
      <option value="عام">عام</option>
      <option value="صورة">توليد صورة</option>
      <option value="فيديو">توليد فيديو</option>
      <option value="يوتيوب">YouTube</option>
      <option value="تسويق">تسويق وإعلان</option>
      <option value="بيزنس">Business</option>
      <option value="سوشيال ميديا">Social Media</option>
    </select>

    <label>🤖 الأداة المستهدفة</label>

    <select id="tool">
      <option value="ChatGPT">ChatGPT</option>
      <option value="Gemini">Gemini</option>
      <option value="Claude">Claude</option>
      <option value="Midjourney">Midjourney</option>
      <option value="Image AI">Image AI</option>
      <option value="Video AI">Video AI</option>
    </select>

    <button onclick="generatePrompt()">
      ✨ إنشاء Prompt
    </button>

  </div>

  <div class="card">

    <label>📋 الـ Prompt الناتج</label>

    <div id="result" class="result">
      سيظهر الـPrompt هنا...
    </div>

    <button class="copy" onclick="copyPrompt()">
      📋 نسخ الـPrompt
    </button>

    <button class="clear" onclick="clearAll()">
      🗑️ مسح
    </button>

  </div>

  <div class="footer">
    Prompt Pilot © 2026
  </div>

</div>

<script>

function generatePrompt() {

  const idea = document.getElementById("idea").value.trim();
  const type = document.getElementById("type").value;
  const tool = document.getElementById("tool").value;
  const result = document.getElementById("result");

  if (!idea) {
    result.textContent = "⚠️ اكتب فكرتك أولاً.";
    return;
  }

  const prompt =
`You are an expert prompt engineer.

OBJECTIVE:
${idea}

CONTENT TYPE:
${type}

TARGET AI TOOL:
${tool}

ROLE:
Act as a professional expert specialized in creating high-quality prompts for the selected AI tool.

INSTRUCTIONS:
1. Understand the user's objective.
2. Improve and structure the idea.
3. Add useful details when necessary.
4. Keep the original intent unchanged.
5. Make the prompt specific and actionable.
6. Optimize the prompt for the selected AI tool.
7. Avoid unnecessary information.
8. Produce a professional result ready to copy and use.

OUTPUT:
Return only the final optimized prompt.`;

  result.textContent = prompt;
}

function copyPrompt() {

  const text = document.getElementById("result").textContent;

  if (!text || text === "سيظهر الـPrompt هنا...") {
    alert("⚠️ أنشئ Prompt أولاً.");
    return;
  }

  navigator.clipboard.writeText(text)
    .then(() => {
      alert("✅ تم نسخ الـPrompt");
    })
    .catch(() => {
      alert("❌ تعذر النسخ تلقائيًا.");
    });
}

function clearAll() {

  document.getElementById("idea").value = "";

  document.getElementById("result").textContent =
    "سيظهر الـPrompt هنا...";
}

</script>

</body>
</html>
