<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prompt Pilot</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #0f172a;
  color: #fff;
}

.container {
  width: 92%;
  max-width: 900px;
  margin: 30px auto;
}

.header {
  text-align: center;
  margin-bottom: 25px;
}

.logo {
  font-size: 42px;
  font-weight: bold;
}

.subtitle {
  color: #94a3b8;
  margin-top: 8px;
}

.card {
  background: #1e293b;
  padding: 22px;
  border-radius: 18px;
  margin-bottom: 20px;
}

label {
  display: block;
  margin: 15px 0 8px;
  font-weight: bold;
}

textarea,
select {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #334155;
  background: #0f172a;
  color: white;
  font-size: 16px;
}

textarea {
  min-height: 150px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 18px;
  border: 0;
  border-radius: 10px;
  background: #6366f1;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #4f46e5;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.result {
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 18px;
  min-height: 180px;
  white-space: pre-wrap;
  line-height: 1.8;
  direction: ltr;
  text-align: left;
  overflow-wrap: break-word;
}

.copy {
  background: #10b981;
}

.copy:hover {
  background: #059669;
}

.clear {
  background: #475569;
}

.footer {
  text-align: center;
  color: #64748b;
  font-size: 13px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">🚀 Prompt Pilot</div>

    <div class="subtitle">
      حوّل فكرتك إلى Prompt احترافي جاهز للاستخدام
    </div>
  </div>

  <div class="card">

    <label>💡 فكرتك</label>

    <textarea
      id="idea"
      placeholder="اكتب فكرتك هنا..."
    ></textarea>

    <label>🎯 نوع المحتوى</label>

    <select id="type">
      <option value="عام">عام</option>
      <option value="صورة">توليد صورة</option>
      <option value="فيديو">توليد فيديو</option>
      <option value="يوتيوب">YouTube</option>
      <option value="تسويق">تسويق وإعلان</option>
      <option value="بيزنس">Business</option>
      <option value="سوشيال ميديا">Social Media</option>
    </select>

    <label>🤖 الأداة المستهدفة</label>

    <select id="tool">
      <option value="ChatGPT">ChatGPT</option>
      <option value="Gemini">Gemini</option>
      <option value="Claude">Claude</option>
      <option value="Midjourney">Midjourney</option>
      <option value="Image AI">Image AI</option>
      <option value="Video AI">Video AI</option>
    </select>

    <button id="generateButton" onclick="generatePrompt()">
      ✨ إنشاء Prompt
    </button>

  </div>

  <div class="card">

    <label>📋 الـ Prompt الناتج</label>

    <div id="result" class="result">
      سيظهر الـPrompt هنا...
    </div>

    <button class="copy" onclick="copyPrompt()">
      📋 نسخ الـPrompt
    </button>

    <button class="clear" onclick="clearAll()">
      🗑️ مسح
    </button>

  </div>

  <div class="footer">
    Prompt Pilot © 2026
  </div>

</div>

<script>

const WORKER_URL =
  "https://prompt-pilot-api.matrx10.workers.dev/";

async function generatePrompt() {

  const idea =
    document.getElementById("idea").value.trim();

  const type =
    document.getElementById("type").value;

  const tool =
    document.getElementById("tool").value;

  const result =
    document.getElementById("result");

  const button =
    document.getElementById("generateButton");

  if (!idea) {

    result.textContent =
      "⚠️ اكتب فكرتك أولاً.";

    return;
  }

  button.disabled = true;

  button.textContent =
    "⏳ جاري إنشاء الـPrompt...";

  result.textContent =
    "🤖 الذكاء الاصطناعي يعمل الآن...";

  try {

    const response = await fetch(WORKER_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({

        idea: idea,

        contentType: type,

        targetTool: tool

      })

    });

    const data = await response.json();

    if (!response.ok || !data.success) {

      throw new Error(
        data.error ||
        "حدث خطأ أثناء إنشاء الـPrompt."
      );

    }

    result.textContent =
      data.prompt;

  } catch (error) {

    console.error(error);

    result.textContent =
      "❌ حدث خطأ:\n\n" +
      error.message;

  } finally {

    button.disabled = false;

    button.textContent =
      "✨ إنشاء Prompt";

  }
}


function copyPrompt() {

  const text =
    document.getElementById("result").textContent;

  if (
    !text ||
    text === "سيظهر الـPrompt هنا..." ||
    text.startsWith("🤖") ||
    text.startsWith("❌")
  ) {

    alert("⚠️ أنشئ Prompt أولاً.");

    return;
  }

  navigator.clipboard.writeText(text)

    .then(() => {

      alert("✅ تم نسخ الـPrompt");

    })

    .catch(() => {

      alert("❌ تعذر النسخ تلقائيًا.");

    });

}


function clearAll() {

  document.getElementById("idea").value = "";

  document.getElementById("result").textContent =
    "سيظهر الـPrompt هنا...";

}

</script>

</body>
</html>
